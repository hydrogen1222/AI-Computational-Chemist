name: AICC modeling-first smoke

on:
  pull_request:
  push:
    branches:
      - main
      - "refactor/**"
      - "cleanup/**"
      - "feat/**"
      - "fix/**"

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Syntax check installer and CLI
        run: |
          bash -n install.sh
          python -m compileall -q aicc
      - name: Install plotting test dependency
        run: python -m pip install 'matplotlib>=3.8,<4'
      - name: Test one-agent routing and CLI
        run: |
          python aicc/tests/smoke_test.py
          python aicc/tests/plotting_skill_test.py
          python aicc/tests/batch_bader_test.py
          python aicc/tests/charge_report_test.py
          python aicc/tests/ddec6_test.py
          python aicc/tests/hirshfeld_test.py
          python aicc/tests/multiwfn_periodic_test.py
          python aicc/tests/periodic_cdft_test.py
          python aicc/tests/periodic_cdft_grid_test.py
          python aicc/tests/software_discovery_test.py
          python aicc/tests/retired_components_test.py
      - name: Verify clean install has no retired skills
        run: |
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          mkdir -p "$tmp/home"
          HOME="$tmp/home" XDG_STATE_HOME="$tmp/state" bash ./install.sh --target "$tmp/skills" --harness codex
          test -f "$tmp/skills/scientific-modeling/SKILL.md"
          test -f "$tmp/skills/batch-postprocessing/SKILL.md"
          test -f "$tmp/skills/structure-prep/SKILL.md"
          test -f "$tmp/skills/chargemol/SKILL.md"
          test -f "$tmp/skills/plotting/SKILL.md"
          test -f "$tmp/skills/periodic-cdft/SKILL.md"
          test -f "$tmp/skills/periodic-cdft/scripts/preflight.py"
          test -f "$tmp/skills/periodic-cdft/scripts/condensed.py"
          test -f "$tmp/skills/periodic-cdft/scripts/grid_audit.py"
          test -f "$tmp/skills/periodic-cdft/scripts/make_critic2.py"
          test -f "$tmp/skills/plotting/scripts/pubstyle.py"
          test -f "$tmp/skills/plotting/scripts/init_figure.py"
          test ! -e "$tmp/skills/research-orchestrator"
          test ! -e "$tmp/skills/hpc-submit"
          test ! -e "$tmp/skills/rsess"
          test ! -e "$tmp/skills/comp-chem-workflow"
